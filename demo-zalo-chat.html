<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zalo Chat UI — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1A73E8',
            'primary-hover': '#1669C1',
            'primary-light': '#E8F0FE',
            online: '#22C55E',
            surface: '#FFFFFF',
            bgPage: '#F5F7FB',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          keyframes: {
            messageIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            typingDot: {
              '0%, 60%, 100%': { transform: 'translateY(0)', opacity: '0.4' },
              '30%': { transform: 'translateY(-4px)', opacity: '1' },
            },
            reactionPop: {
              '0%':   { transform: 'scale(0) translateY(0)',    opacity: '0' },
              '50%':  { transform: 'scale(1.4) translateY(-8px)', opacity: '1' },
              '100%': { transform: 'scale(1) translateY(-20px)', opacity: '0' },
            },
            fadeIn: {
              '0%':   { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            slideInRight: {
              '0%':   { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(0)' },
            },
          },
          animation: {
            messageIn:  'messageIn 0.2s ease-out',
            typingDot:  'typingDot 1.2s infinite',
            typingDot2: 'typingDot 1.2s 0.2s infinite',
            typingDot3: 'typingDot 1.2s 0.4s infinite',
            reactionPop: 'reactionPop 0.6s ease forwards',
            fadeIn: 'fadeIn 0.15s ease-out',
            slideInRight: 'slideInRight 0.25s cubic-bezier(0.4,0,0.2,1)',
          },
        },
      },
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; }

    /* Scrollbar tùy chỉnh */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* Dark mode scrollbar */
    .dark ::-webkit-scrollbar-thumb { background: #475569; }

    /* Typing indicator dots */
    .dot1 { animation: typingDot 1.2s infinite; }
    .dot2 { animation: typingDot 1.2s 0.2s infinite; }
    .dot3 { animation: typingDot 1.2s 0.4s infinite; }
    @keyframes typingDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Message animation */
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-animate { animation: messageIn 0.2s ease-out; }

    /* Reaction pop animation */
    @keyframes reactionPop {
      0%   { transform: scale(0) translateY(0); opacity: 0; }
      50%  { transform: scale(1.4) translateY(-8px); opacity: 1; }
      100% { transform: scale(1) translateY(-20px); opacity: 0; }
    }
    .reaction-float {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: reactionPop 0.7s ease forwards;
      z-index: 9999;
      user-select: none;
    }

    /* Context menu */
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.93) translateY(4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .ctx-menu { animation: fadeInScale 0.12s ease-out; }

    /* Mobile: ẩn chat list khi đang trong chat */
    @media (max-width: 768px) {
      .mobile-in-chat .chat-list-panel { display: none !important; }
      .mobile-in-chat .chat-window-panel { display: flex !important; }
      .chat-window-panel { display: none; }
    }
  </style>
</head>
<body class="bg-bgPage dark:bg-slate-900 h-screen overflow-hidden transition-colors duration-300">

<!-- APP LAYOUT -->
<div class="flex h-screen overflow-hidden" id="appLayout">

  <!-- ───── SIDEBAR (72px) ───── -->
  <aside class="w-[72px] flex-shrink-0 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col items-center py-4 gap-2 transition-colors">
    <!-- Logo -->
    <div class="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center mb-2 shadow-lg">
      <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
      </svg>
    </div>

    <!-- Nav Items -->
    <button onclick="setNav('chat')" id="nav-chat" class="sidebar-btn active-nav w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer transition-all duration-150 text-primary bg-primary-light" title="Tin nhắn">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </button>
    <button onclick="setNav('contacts')" id="nav-contacts" class="sidebar-btn w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer transition-all duration-150 text-gray-400 hover:bg-primary-light hover:text-primary dark:hover:bg-slate-700" title="Danh bạ">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    </button>
    <button onclick="setNav('cloud')" id="nav-cloud" class="sidebar-btn w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer transition-all duration-150 text-gray-400 hover:bg-primary-light hover:text-primary dark:hover:bg-slate-700" title="Cloud của tôi">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
    </button>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Dark Mode Toggle -->
    <button onclick="toggleDark()" class="w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer text-gray-400 hover:bg-primary-light hover:text-primary dark:hover:bg-slate-700 transition-all duration-150" title="Đổi giao diện">
      <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      <svg id="moonIcon" class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <!-- Avatar -->
    <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary cursor-pointer" title="Tôi">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=me&backgroundColor=b6e3f4" class="w-full h-full object-cover" />
    </div>
  </aside>

  <!-- ───── CHAT LIST (300px) ───── -->
  <div class="chat-list-panel w-[300px] flex-shrink-0 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col transition-colors">
    <!-- Header -->
    <div class="px-4 pt-5 pb-3">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-bold text-gray-900 dark:text-white">Tin nhắn</h2>
        <button class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </button>
      </div>
      <!-- Search -->
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="searchInput" oninput="filterChats(this.value)" type="text" placeholder="Tìm kiếm..."
          class="w-full h-9 pl-9 pr-4 rounded-full bg-gray-100 dark:bg-slate-700 text-sm text-gray-700 dark:text-slate-200 placeholder-gray-400 dark:placeholder-slate-400 border-none outline-none focus:ring-2 focus:ring-primary/30 transition-all" />
      </div>
    </div>

    <!-- Chat List -->
    <div id="chatList" class="flex-1 overflow-y-auto">
      <!-- Được render bằng JS -->
    </div>
  </div>

  <!-- ───── CHAT WINDOW ───── -->
  <div class="chat-window-panel flex-1 flex flex-col bg-bgPage dark:bg-slate-900 min-w-0 transition-colors">

    <!-- Chat Header -->
    <div class="h-14 flex-shrink-0 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 flex items-center gap-3 px-4 shadow-sm">
      <!-- Back (mobile) -->
      <button onclick="goBack()" class="md:hidden w-8 h-8 flex items-center justify-center text-gray-500 hover:bg-gray-100 rounded-full transition-colors">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>

      <div class="relative flex-shrink-0">
        <img id="headerAvatar" src="" class="w-9 h-9 rounded-full object-cover" />
        <span id="headerStatus" class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-slate-800 bg-green-500"></span>
      </div>
      <div class="flex-1 min-w-0">
        <p id="headerName" class="font-semibold text-sm text-gray-900 dark:text-white truncate"></p>
        <p id="headerSub" class="text-xs text-green-500"></p>
      </div>
      <div class="flex items-center gap-1">
        <button class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors" title="Gọi thoại">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
        <button class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors" title="Gọi video">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
        <button class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors" title="Thông tin">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Messages Area -->
    <div id="messageArea" class="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-1"
         oncontextmenu="return false;">
      <!-- Messages rendered by JS -->
    </div>

    <!-- Typing indicator -->
    <div id="typingIndicator" class="hidden px-4 pb-2">
      <div class="flex items-end gap-2">
        <img id="typingAvatar" src="" class="w-7 h-7 rounded-full object-cover flex-shrink-0" />
        <div class="flex items-center gap-1 bg-gray-200 dark:bg-slate-700 px-3 py-2 rounded-[16px_16px_16px_0]">
          <span class="w-1.5 h-1.5 rounded-full bg-gray-500 dark:bg-slate-400 dot1 inline-block"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-gray-500 dark:bg-slate-400 dot2 inline-block"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-gray-500 dark:bg-slate-400 dot3 inline-block"></span>
        </div>
        <span class="text-xs text-gray-400 dark:text-slate-500">đang nhập...</span>
      </div>
    </div>

    <!-- Reply Preview -->
    <div id="replyPreview" class="hidden mx-4 mb-1 px-3 py-2 bg-primary-light dark:bg-slate-700 rounded-xl border-l-4 border-primary flex items-start gap-2">
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-primary">Đang trả lời</p>
        <p id="replyText" class="text-xs text-gray-600 dark:text-slate-300 truncate"></p>
      </div>
      <button onclick="cancelReply()" class="text-gray-400 hover:text-gray-600 flex-shrink-0">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <!-- Input Bar -->
    <div class="flex-shrink-0 bg-white dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 px-3 py-2 flex items-center gap-2">
      <!-- Emoji -->
      <button id="emojiBtn" onclick="toggleEmojiPicker()" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:bg-primary-light hover:text-primary dark:hover:bg-slate-700 transition-all duration-150 flex-shrink-0">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.47 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
      </button>

      <!-- Emoji Picker -->
      <div id="emojiPicker" class="hidden absolute bottom-16 left-24 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-slate-600 p-3 z-50 ctx-menu">
        <div class="grid grid-cols-8 gap-1">
        </div>
      </div>

      <!-- Text Input -->
      <input id="msgInput" type="text" placeholder="Nhập tin nhắn..."
        class="flex-1 h-10 rounded-full px-4 bg-gray-100 dark:bg-slate-700 text-sm text-gray-800 dark:text-slate-200 placeholder-gray-400 dark:placeholder-slate-400 outline-none focus:ring-2 focus:ring-primary/30 transition-all"
        onkeydown="handleKeyDown(event)"
        oninput="onInputChange()" />

      <!-- Attach -->
      <button class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:bg-primary-light hover:text-primary dark:hover:bg-slate-700 transition-all duration-150 flex-shrink-0">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
      </button>

      <!-- Send -->
      <button id="sendBtn" onclick="sendMessage()"
        class="w-9 h-9 rounded-full flex items-center justify-center bg-primary text-white hover:bg-primary-hover active:scale-95 transition-all duration-150 flex-shrink-0 shadow-md shadow-primary/30">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div id="contextMenu" class="hidden fixed z-[9999] bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-slate-600 p-1.5 min-w-[160px] ctx-menu">
  <button class="ctx-item w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors" onclick="ctxAction('reply')">
    <span>💬</span> Trả lời
  </button>
  <button class="ctx-item w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors" onclick="ctxAction('forward')">
    <span>↪️</span> Chuyển tiếp
  </button>
  <button class="ctx-item w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors" onclick="ctxAction('copy')">
    <span>📋</span> Sao chép
  </button>
  <div class="my-1 border-t border-gray-100 dark:border-slate-700"></div>
  <button class="ctx-item w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors" onclick="ctxAction('delete')">
    <span>🗑️</span> Xóa
  </button>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 text-sm px-4 py-2 rounded-full shadow-xl z-[9999] ctx-menu font-medium"></div>

<script>
/* ===== DATA ===== */
const emojis = ['😀','😂','🥰','😎','🤔','😴','🥳','😤','😭','😱','🤩','😏','🙄','😇','🤪','😋','🥺','😈','💀','👻','🔥','❤️','💯','✨','🎉','👍','👎','🙏','💪','🤝','🎁','🌈','🍕','🍔','☕','🎮','🎵','🚀','💡','⭐'];

const contacts = [
  { id: 1, name: 'Nguyễn Thị Lan', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=lan&backgroundColor=b6e3f4', online: true,  lastMsg: 'Bạn có rảnh không? 😊', time: '10:32', unread: 3 },
  { id: 2, name: 'Trần Minh Tuấn', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=tuan&backgroundColor=ffd5dc', online: true,  lastMsg: 'Ok mình sẽ gửi file sau nhé', time: '09:15', unread: 0 },
  { id: 3, name: 'Phạm Thu Hương', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=huong&backgroundColor=c0aede', online: false, lastMsg: 'Cảm ơn bạn nhiều lắm!', time: 'Hôm qua', unread: 0 },

/* ===== STATE ===== */
let state = {
  activeId: 1,
  messages: [],
  replyTo: null,
  typingTimer: null,
  isTyping: false,
  contextTarget: null,
  isDark: false,
  nextId: 100,
};

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded', () => {
  renderChatList(contacts);
  selectChat(1);
  setupEmojiPicker();
  document.addEventListener('click', hideContextMenu);
  document.addEventListener('click', hideEmojiPicker);
});

/* ===== THEME ===== */
function toggleDark() {
  state.isDark = !state.isDark;
  document.documentElement.classList.toggle('dark', state.isDark);
}

/* ===== NAV ===== */
function setNav(key) {
  document.querySelectorAll('.sidebar-btn').forEach(b => {
    b.classList.remove('bg-primary-light', 'text-primary', 'active-nav');
    b.classList.add('text-gray-400');
  });
  const btn = document.getElementById('nav-' + key);
  if (btn) {
    btn.classList.add('bg-primary-light', 'text-primary', 'active-nav');
    btn.classList.remove('text-gray-400');

}

/* ===== CHAT LIST ===== */
function renderChatList(list) {
  const el = document.getElementById('chatList');
  el.innerHTML = list.map(c => `
    <div id="chat-item-${c.id}" onclick="selectChat(${c.id})"
      class="chat-item flex items-center gap-3 px-4 h-[72px] cursor-pointer transition-colors duration-150 hover:bg-gray-50 dark:hover:bg-slate-700/60 ${c.id === state.activeId ? 'bg-primary-light dark:bg-slate-700' : ''}">
      <div class="relative flex-shrink-0">
        <img src="${c.avatar}" class="w-10 h-10 rounded-full object-cover bg-gray-200" />
        ${c.online ? `<span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-slate-800 bg-green-500"></span>` : ''}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <p class="font-semibold text-sm text-gray-900 dark:text-white truncate">${c.name}</p>
          <span class="text-[11px] text-gray-400 dark:text-slate-400 flex-shrink-0 ml-1">${c.time}</span>
        </div>
        <div class="flex items-center justify-between mt-0.5">
          <p class="text-xs text-gray-500 dark:text-slate-400 truncate">${c.lastMsg}</p>
          ${c.unread > 0 ? `<span class="ml-1 flex-shrink-0 min-w-[18px] h-[18px] bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function filterChats(query) {
  const q = query.toLowerCase();
  const filtered = contacts.filter(c => c.name.toLowerCase().includes(q) || c.lastMsg.toLowerCase().includes(q));
  renderChatList(filtered);
}

/* ===== SELECT CHAT ===== */
function selectChat(id) {
  state.activeId = id;
  const contact = contacts.find(c => c.id === id);
  if (!contact) return;

  // Clear unread
  contact.unread = 0;
  renderChatList(contacts);

  // Update header
  document.getElementById('headerAvatar').src = contact.avatar;
  document.getElementById('headerName').textContent = contact.name;
  document.getElementById('headerSub').textContent = contact.online ? 'Đang hoạt động' : 'Không hoạt động';
  document.getElementById('headerStatus').className = `absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-slate-800 ${contact.online ? 'bg-green-500' : 'bg-gray-400'}`;
  document.getElementById('typingAvatar').src = contact.avatar;

  // Load messages
  state.messages = JSON.parse(JSON.stringify(messageHistory[id] || []));
  renderMessages();

  // Simulate typing after 1.5s for online contacts
  clearTimeout(state.fakeTypingTimer);
  if (contact.online && Math.random() > 0.4) {
    state.fakeTypingTimer = setTimeout(() => showTyping(contact), 1500 + Math.random() * 1000);
  }

  // Mobile: switch to chat window
  document.getElementById('appLayout').classList.add('mobile-in-chat');
}

function goBack() {
  document.getElementById('appLayout').classList.remove('mobile-in-chat');
}

/* ===== RENDER MESSAGES ===== */
function renderMessages(newOnly = false) {
  const area = document.getElementById('messageArea');
  if (!newOnly || area.children.length === 0) {
    area.innerHTML = '';
    state.messages.forEach((msg, i) => {
      area.appendChild(createMessageEl(msg, i, false));
    });
  } else {
    const msg = state.messages[state.messages.length - 1];
    area.appendChild(createMessageEl(msg, state.messages.length - 1, true));
  }
  scrollToBottom();
}

function createMessageEl(msg, idx, animate) {
  const isSent = msg.from === 'me';
  const prev = state.messages[idx - 1];
  const next = state.messages[idx + 1];
  const sameAsPrev = prev && prev.from === msg.from;
  const sameAsNext = next && next.from === msg.from;

  let borderRadius = isSent
    ? 'rounded-[16px_16px_0_16px]'
    : 'rounded-[16px_16px_16px_0]';

  if (sameAsPrev && sameAsNext) {
    borderRadius = isSent ? 'rounded-[16px_4px_4px_16px]' : 'rounded-[4px_16px_16px_4px]';
  } else if (sameAsPrev && !sameAsNext) {
    borderRadius = isSent ? 'rounded-[16px_4px_0_16px]' : 'rounded-[4px_16px_16px_0]';
  } else if (!sameAsPrev && sameAsNext) {
    borderRadius = isSent ? 'rounded-[16px_16px_4px_16px]' : 'rounded-[16px_16px_16px_4px]';
  }

  const contact = contacts.find(c => c.id === state.activeId);
  const row = document.createElement('div');
  row.className = `flex items-end gap-2 ${isSent ? 'flex-row-reverse' : 'flex-row'} ${sameAsPrev ? 'mb-0.5' : 'mb-1'} ${animate ? 'msg-animate' : ''}`;
  row.dataset.msgId = msg.id;

  const avatarHtml = !isSent && !sameAsNext
    ? `<img src="${contact?.avatar}" class="w-7 h-7 rounded-full object-cover flex-shrink-0 mb-0.5" />`
    : `<div class="w-7 flex-shrink-0"></div>`;

  const statusHtml = isSent && !sameAsNext ? `
    <div class="flex items-center gap-0.5 mt-0.5 ${isSent ? 'justify-end' : ''}">
      ${msg.status === 'seen'
        ? `<span class="text-[10px] text-primary font-medium">✓✓ Đã xem</span>`
        : `<span class="text-[10px] text-gray-400">✓✓</span>`}
    </div>` : '';

  row.innerHTML = `
    ${!isSent ? avatarHtml : ''}
    <div class="flex flex-col ${isSent ? 'items-end' : 'items-start'} max-w-[60%]">
      ${msg.replyTo ? `<div class="mb-1 px-3 py-1 bg-gray-200/80 dark:bg-slate-600/80 rounded-lg border-l-2 border-primary text-xs text-gray-600 dark:text-slate-300 truncate max-w-full"><span class="font-semibold text-primary">↩ </span>${msg.replyTo}</div>` : ''}
      <div class="bubble px-3 py-2 text-sm leading-relaxed cursor-pointer select-text ${isSent ? 'bg-primary text-white' : 'bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-100 shadow-sm'} ${borderRadius}"
        oncontextmenu="showContextMenu(event, ${msg.id})"
        ondblclick="showReaction(event)">
        ${msg.text}
      </div>
      ${!sameAsNext ? `<span class="text-[10px] text-gray-400 dark:text-slate-500 mt-0.5 px-1">${msg.time}</span>` : ''}
      ${statusHtml}
    </div>
    ${isSent ? avatarHtml : ''}
  `;
  return row;
}

function scrollToBottom() {
  const area = document.getElementById('messageArea');
  setTimeout(() => area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' }), 50);
}

/* ===== SEND MESSAGE ===== */
function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const now = new Date();
  const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  const msg = {
    id: state.nextId++,
    from: 'me',
    text,
    time,
    status: 'delivered',
    replyTo: state.replyTo,
  };

  state.messages.push(msg);
  input.value = '';
  cancelReply();
  renderMessages(true);

  // Update chat list preview
  const contact = contacts.find(c => c.id === state.activeId);
  if (contact) { contact.lastMsg = text; contact.time = time; }
  renderChatList(contacts);

  // Simulate reply after 1-3s
  if (contact?.online) {
    showTyping(contact);
    setTimeout(() => {
      hideTyping();
      const replies = [
        'Okay! 👍', 'Mình hiểu rồi!', 'Cảm ơn bạn!', 'Cho mình xem thử nhé', 'Bạn nói đúng đó!',
        'Gặp sau nhé! 😊', 'Được rồi bạn ơi', 'Haha okay 😂', 'Mình sẽ xử lý ngay', '✅'
      ];
      const reply = { id: state.nextId++, from: 'them', text: replies[Math.floor(Math.random()*replies.length)], time, status: 'seen' };
      state.messages.push(reply);
      renderMessages(true);
      // Update seen on my last message
      const myMsg = state.messages.find(m => m.id === msg.id);
      if (myMsg) myMsg.status = 'seen';
    }, 1000 + Math.random() * 2000);
  }
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function onInputChange() {
  // Could add real typing broadcast here
}

/* ===== TYPING INDICATOR ===== */
function showTyping(contact) {
  const ti = document.getElementById('typingIndicator');
  ti.classList.remove('hidden');
  scrollToBottom();
}

function hideTyping() {
  document.getElementById('typingIndicator').classList.add('hidden');
}

/* ===== REPLY ===== */
let replyToText = null;
function setReply(text) {
  state.replyTo = text;
  document.getElementById('replyPreview').classList.remove('hidden');
  document.getElementById('replyText').textContent = text;
  document.getElementById('msgInput').focus();
}

function cancelReply() {
  state.replyTo = null;
  document.getElementById('replyPreview').classList.add('hidden');
}

/* ===== CONTEXT MENU ===== */
let ctxMsgId = null;
function showContextMenu(e, msgId) {
  e.preventDefault();
  ctxMsgId = msgId;
  const menu = document.getElementById('contextMenu');
  menu.classList.remove('hidden');
  let x = e.clientX, y = e.clientY;
  const mw = 180, mh = 180;
  if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
  if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
  menu.style.left = x + 'px';
  menu.style.top  = y + 'px';
}

function hideContextMenu(e) {
  if (!e.target.closest('#contextMenu')) {
    document.getElementById('contextMenu').classList.add('hidden');
  }
}

function ctxAction(action) {
  document.getElementById('contextMenu').classList.add('hidden');
  const msg = state.messages.find(m => m.id === ctxMsgId);
  if (!msg) return;

  if (action === 'reply') { setReply(msg.text); }
  else if (action === 'copy') {
    navigator.clipboard?.writeText(msg.text);
    showToast('Đã sao chép ✓');
  }
  else if (action === 'delete') {
    state.messages = state.messages.filter(m => m.id !== ctxMsgId);
    renderMessages();
    showToast('Đã xóa tin nhắn');
  }
  else if (action === 'forward') { showToast('Chức năng chuyển tiếp'); }
}

/* ===== EMOJI REACTION (double-click) ===== */
const reactionEmojis = ['❤️','😂','😮','😢','😡','👍'];
function showReaction(e) {
  const pick = reactionEmojis[Math.floor(Math.random() * reactionEmojis.length)];
  const el = document.createElement('div');
  el.className = 'reaction-float';
  el.textContent = pick;
  el.style.left = (e.clientX - 12) + 'px';
  el.style.top  = (e.clientY - 12) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

/* ===== EMOJI PICKER ===== */
function setupEmojiPicker() {
  const grid = document.querySelector('#emojiPicker .grid');
  emojis.forEach(em => {
    const btn = document.createElement('button');
    btn.textContent = em;
    btn.className = 'text-xl hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg p-1 transition-colors';
    btn.onclick = (e) => {
      e.stopPropagation();
      const input = document.getElementById('msgInput');
      input.value += em;
      input.focus();
      document.getElementById('emojiPicker').classList.add('hidden');
    };
    grid.appendChild(btn);
  });
}

function toggleEmojiPicker(e) {
  const picker = document.getElementById('emojiPicker');
  picker.classList.toggle('hidden');
  if (event) event.stopPropagation();
}

function hideEmojiPicker(e) {
  if (!e.target.closest('#emojiPicker') && !e.target.closest('#emojiBtn')) {
    document.getElementById('emojiPicker').classList.add('hidden');
  }
}

/* ===== TOAST ===== */
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  t.classList.add('ctx-menu');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => t.classList.add('hidden'), duration);
}
